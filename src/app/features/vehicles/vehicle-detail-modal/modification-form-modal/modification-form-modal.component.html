<ion-header class="ion-no-border modal-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="dismiss()">
        <ion-icon name="close-outline" slot="icon-only" />
      </ion-button>
    </ion-buttons>
    <div class="modal-title">{{ isEdit() ? 'Editar modificación' : 'Nueva modificación' }}</div>
  </ion-toolbar>
</ion-header>

<ion-content class="modal-content">
  <div class="page-content">

    <div class="form-group">
      <label>Icono</label>
      <app-icon-picker [value]="icon()" (valueChange)="onIconChange($event)" />
    </div>

    <div class="form-group">
      <label>Categoría</label>
      <ion-select
        [ngModel]="category()" (ngModelChange)="category.set($event)"
        interface="action-sheet" placeholder="Categoría">
        @for (c of categories; track c) {
          <ion-select-option [value]="c">{{ c }}</ion-select-option>
        }
      </ion-select>
    </div>

    <div class="form-group">
      <label>Pieza</label>
      <ion-input placeholder="Llantas 19&quot;, escape, coilovers…"
        [ngModel]="partName()" (ngModelChange)="partName.set($event)" />
    </div>

    <div class="form-group">
      <label>Marca</label>
      <ion-input placeholder="Brembo, KW, Borla…"
        [ngModel]="brand()" (ngModelChange)="brand.set($event)" />
    </div>

    <div class="form-group">
      <label>Coste (€)</label>
      <ion-input type="number" placeholder="0"
        [ngModel]="cost()" (ngModelChange)="cost.set(+$event)" />
    </div>

    <div class="form-group">
      <label>Notas</label>
      <ion-textarea placeholder="Detalles, referencia, instalador…" autoGrow
        [ngModel]="notes()" (ngModelChange)="notes.set($event)" />
    </div>

    @if (error()) {
      <div class="error-banner">
        <ion-icon name="alert-circle-outline" />
        <span>{{ error() }}</span>
      </div>
    }

    <ion-button expand="block" (click)="save()" [disabled]="loading()">
      @if (loading()) { <ion-spinner name="crescent" slot="start" /> }
      {{ isEdit() ? 'Actualizar' : 'Añadir' }}
    </ion-button>
  </div>
</ion-content>
